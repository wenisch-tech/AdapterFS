name: JVM image

on:
  workflow_call: {}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build application JAR
        run: ./mvnw -B -DskipTests package
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build JVM image locally for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: adapterfs:ci-${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_REVISION=${{ github.sha }}
      - name: Validate JVM container protocols
        run: ./scripts/check-protocols.sh adapterfs:ci-${{ github.sha }}
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
      - name: Scan JVM image with Trivy
        if: always()
        shell: bash
        run: |
          set +e
          image=adapterfs:ci-${{ github.sha }}
          status=1
          for attempt in 1 2 3; do
            trivy image --format table --output trivy-jvm-report.txt --scanners vuln --vuln-type os,library --severity CRITICAL,HIGH,MEDIUM "$image"
            status=$?
            [ "$status" -eq 0 ] && break
            sleep 10
          done
          if [ ! -s trivy-jvm-report.txt ]; then
            printf 'Trivy scan could not complete after retries.\nImage: %s\nExit status: %s\n' "$image" "$status" > trivy-jvm-report.txt
          fi
          exit 0
      - name: Upload JVM Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-jvm-${{ github.run_id }}
          path: trivy-jvm-report.txt
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture JVM image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/wenisch-tech/adapterfs:${{ github.sha }}
            ghcr.io/wenisch-tech/adapterfs:latest
            ghcr.io/wenisch-tech/adapterfs:main
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

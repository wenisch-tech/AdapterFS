name: Release
on: {workflow_call: {}}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25', cache: maven}
      - uses: azure/setup-helm@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v4
        with: {name: adapterfs-native-linux-amd64, path: release}
      - name: Determine semantic version
        id: version
        shell: bash
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}; raw=${latest#v}; IFS=. read -r major minor patch <<< "$raw"
          version="$major.$minor.$((patch + 1))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package release artifacts
        run: |
          ./mvnw -B -DskipTests package
          mkdir -p release
          cp target/adapterfs.jar release/adapterfs-${{ steps.version.outputs.version }}.jar
          helm package charts/adapterfs --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.version }} -d release
      - name: Publish chart to GHCR OCI
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm push release/adapterfs-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/wenisch-tech/helm-charts
      - name: Generate SBOM
        run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputDirectory=release -DoutputName=adapterfs-sbom
      - name: Version and sign OCI artifacts
        run: |
          version=${{ steps.version.outputs.version }}
          docker buildx imagetools create -t ghcr.io/wenisch-tech/adapterfs:$version ghcr.io/wenisch-tech/adapterfs:${{ github.sha }}
          docker buildx imagetools create -t ghcr.io/wenisch-tech/adapterfs:native-$version ghcr.io/wenisch-tech/adapterfs:native-${{ github.sha }}
          cosign sign --yes ghcr.io/wenisch-tech/adapterfs:$version
          cosign sign --yes ghcr.io/wenisch-tech/adapterfs:native-$version
          cosign sign --yes ghcr.io/wenisch-tech/helm-charts/adapterfs:$version
          cosign sign-blob --yes release/adapterfs-$version.tgz --bundle release/adapterfs-$version.tgz.cosign.bundle
          (cd release && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*

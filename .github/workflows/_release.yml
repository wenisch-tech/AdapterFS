name: Release
on:
  workflow_call:
    inputs:
      version: {required: true, type: string}
      tag: {required: true, type: string}
      changelog: {required: true, type: string}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '25', cache: maven}
      - uses: azure/setup-helm@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Package release artifacts
        run: |
          ./mvnw -B versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false
          python3 - <<'PY'
          from pathlib import Path
          chart = Path("charts/adapterfs/Chart.yaml")
          version = "${{ inputs.version }}"
          contents = chart.read_text()
          contents = __import__("re").sub(r"^version: .*", f"version: {version}", contents, flags=__import__("re").M)
          contents = __import__("re").sub(r"^appVersion: .*", f'appVersion: "{version}"', contents, flags=__import__("re").M)
          chart.write_text(contents)
          PY
          ./mvnw -B -DskipTests package
          mkdir -p release
          cp target/adapterfs.jar release/adapterfs-${{ inputs.version }}.jar
          helm package charts/adapterfs --version ${{ inputs.version }} --app-version ${{ inputs.version }} -d release
      - name: Publish chart archive to charts repository
        env:
          # This fine-grained token needs Contents: write access to wenisch-tech/helm-charts.
          # GITHUB_TOKEN is scoped to this repository and cannot write to a different repository.
          GH_TOKEN: ${{ secrets.HELM_CHARTS_TOKEN || secrets.GITHUBTOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "Set HELM_CHARTS_TOKEN (or the legacy GITHUBTOKEN) with Contents: write for wenisch-tech/helm-charts." >&2
            exit 1
          }
          git clone "https://x-access-token:${GH_TOKEN}@github.com/wenisch-tech/helm-charts.git" charts-repo
          mkdir -p charts-repo/adapterfs
          cp release/adapterfs-${{ inputs.version }}.tgz charts-repo/adapterfs/
          cd charts-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adapterfs/adapterfs-${{ inputs.version }}.tgz
          git commit -m "Add adapterfs helm chart in version ${{ inputs.version }}" || exit 0
          git push origin main
      - name: Publish chart to GHCR OCI
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm push release/adapterfs-${{ inputs.version }}.tgz oci://ghcr.io/wenisch-tech/helm-charts
      - name: Generate SBOM
        run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputDirectory=release -DoutputName=adapterfs-sbom
      - name: Version and sign OCI artifacts
        run: |
          version=${{ inputs.version }}
          docker buildx imagetools create -t ghcr.io/wenisch-tech/adapterfs:$version ghcr.io/wenisch-tech/adapterfs:${{ github.sha }}
          cosign sign --yes ghcr.io/wenisch-tech/adapterfs:$version
          cosign sign --yes ghcr.io/wenisch-tech/helm-charts/adapterfs:$version
          cosign sign-blob --yes release/adapterfs-$version.tgz --bundle release/adapterfs-$version.tgz.cosign.bundle
          (cd release && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          body: ${{ inputs.changelog }}
          files: release/*

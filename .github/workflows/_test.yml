name: Test
on: {workflow_call: {}}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '25', cache: maven}
      - run: ./mvnw -B verify
      - name: Helm lint
        uses: azure/setup-helm@v5
      - run: helm lint charts/adapterfs && helm template test charts/adapterfs >/dev/null
      - uses: actions/upload-artifact@v7
        with: {name: adapterfs-jar, path: target/adapterfs.jar}

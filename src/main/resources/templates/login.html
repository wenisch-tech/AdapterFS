<!doctype html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · AdapterFS</title><link rel="stylesheet" href="/assets/app.css"></head>
<body class="login-page">
<main class="login-card">
  <div class="brand brand-large"><span class="brand-mark">A</span><span>AdapterFS</span></div>
  <p class="eyebrow">FILESYSTEM GATEWAY</p>
  <h1>Welcome back</h1><p class="muted">Sign in to browse and manage the connected files.</p>
  <div class="alert error" th:if="${param.error}">The username or password is incorrect.</div>
  <div class="alert success" th:if="${param.logout}">You have been signed out.</div>
  <form method="post" action="/login" class="login-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Username<input name="username" autocomplete="username" autofocus required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button primary" type="submit">Sign in</button>
  </form>
  <a th:if="${@environment.getProperty('spring.security.oauth2.client.registration.adapterfs.client-id')}" class="button oidc" href="/oauth2/authorization/adapterfs">Continue with OpenID Connect</a>
  <p class="login-footer">Secure access to mounted filesystems</p>
</main>
</body></html>
